<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Viewport correcta para móvil: sin zoom, cubre el notch -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Contador Chat</title>

<!-- Manifest embebido como data URI (un solo archivo) -->
<link id="manifestLink" rel="manifest" href='data:application/manifest+json,{"name":"Contador Chat","short_name":"Contador Chat","start_url":".","display":"standalone","background_color":"%230f1115","theme_color":"%230f1115","icons":[{"src":"data:image/svg+xml,%253Csvg xmlns=%2527http://www.w3.org/2000/svg%2527 viewBox=%25270 0 100 100%2527%253E%253Crect width=%2527100%2527 height=%2527100%2527 rx=%252722%2527 fill=%2527%2525236ad3%2527/%253E%253Ctext x=%252750%2527 y=%252768%2527 font-size=%252755%2527 text-anchor=%2527middle%2527 fill=%2527white%2527 font-family=%2527sans-serif%2527%253E%252B%253C/text%253E%253C/svg%253E","sizes":"any","type":"image/svg+xml","purpose":"any"}]}'>

<!-- Ícono SVG para iOS / pestaña -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23236ad3'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif'%3E%2B%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23236ad3'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif'%3E%2B%3C/text%3E%3C/svg%3E">

<style>
  /* ===== Estilos base: oscuro, móvil, sin selección de texto ===== */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background:#0f1115; color:#e8eaf0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select:none; -webkit-user-select:none;   /* evita seleccionar texto */
    touch-action: manipulation;                    /* evita zoom por doble toque */
    display:flex; flex-direction:column;
    /* Safe areas para notch */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    overscroll-behavior: none;
  }

  main { flex:1; overflow-y:auto; display:flex; flex-direction:column; }

  /* ===== Pantalla Contador ===== */
  #vistaContador { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:8px; }
  .etiqueta { font-size:1rem; color:#8b93a5; letter-spacing:2px; text-transform:uppercase; }
  #hoyNum { font-size: clamp(4rem, min(30vw, 18vh), 11rem); font-weight:800; line-height:1; }
  .subtotales { display:flex; gap:24px; margin-top:4px; }
  .subtotales div { text-align:center; }
  .subtotales .num { font-size:1.4rem; font-weight:700; }
  .subtotales .lbl { font-size:.75rem; color:#8b93a5; }

  /* Botón + gigante */
  #btnMas {
    width:min(70vw, 300px, 36vh); height:min(70vw, 300px, 36vh); min-width:130px; min-height:130px; border-radius:50%;
    border:none; background:#236ad3; color:#fff; font-size:clamp(3rem, 14vh, 6rem); font-weight:300;
    margin-top:16px; cursor:pointer;
    box-shadow:0 8px 30px rgba(35,106,211,.4);
    transition: transform .08s ease;
  }
  #btnMas:active { transform:scale(.93); }
  /* Botón − pequeño */
  #btnMenos {
    margin-top:16px; padding:12px 32px; border-radius:999px;
    border:1px solid #2a3040; background:#171b24; color:#c8cedd;
    font-size:1.3rem; cursor:pointer;
  }
  #btnMenos:active { transform:scale(.95); }

  /* Interruptor Wake Lock */
  .wakelock { margin-top:20px; display:flex; align-items:center; gap:8px; font-size:.8rem; color:#8b93a5; }

  /* Hover en escritorio */
  @media (hover:hover) {
    #btnMas:hover { background:#2f78e6; }
    #btnMenos:hover, .navMes button:hover, .exportBtns button:hover, .exportBtns label:hover { background:#1f2430; }
    nav button:hover { color:#e8eaf0; }
  }
  .atajos { display:none; margin-top:10px; font-size:.75rem; color:#5d6577; }
  @media (hover:hover) and (pointer:fine) { .atajos { display:block; } }

  /* Animación del número al tocar */
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .pop { animation: pop .18s ease; }

  /* ===== Pantalla Historial ===== */
  #vistaHistorial { display:none; flex:1; flex-direction:column; padding:16px; width:100%; max-width:560px; margin:0 auto; }
  .navMes { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .navMes button { background:#171b24; color:#e8eaf0; border:1px solid #2a3040; border-radius:10px; padding:10px 16px; font-size:1.1rem; cursor:pointer; }
  .navMes .titulo { font-size:1.05rem; font-weight:700; text-transform:capitalize; }
  #totalMes { text-align:center; color:#8b93a5; margin-bottom:12px; }
  #listaDias { flex:1; overflow-y:auto; }
  .fila { display:flex; justify-content:space-between; padding:12px 6px; border-bottom:1px solid #1e2330; font-size:1.05rem; }
  .fila .cant { font-weight:700; color:#5b93ff; }
  .exportBtns { display:flex; gap:10px; padding-top:14px; flex-wrap:wrap; }
  .exportBtns button, .exportBtns label {
    flex:1; min-width:120px; padding:12px; text-align:center; border-radius:10px;
    border:1px solid #2a3040; background:#171b24; color:#e8eaf0; font-size:.85rem; cursor:pointer;
  }

  /* ===== Barra de pestañas inferior ===== */
  nav {
    display:flex; border-top:1px solid #1e2330; background:#12151c;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex:1; padding:14px; background:none; border:none; color:#8b93a5;
    font-size:.85rem; cursor:pointer;
  }
  nav button.activo { color:#5b93ff; font-weight:700; }
</style>
</head>
<body>

<main>
  <!-- ========== VISTA CONTADOR ========== -->
  <section id="vistaContador">
    <div class="etiqueta">Mensajes hoy</div>
    <div id="hoyNum">0</div>
    <div class="subtotales">
      <div><div class="num" id="semNum">0</div><div class="lbl">SEMANA</div></div>
      <div><div class="num" id="mesNum">0</div><div class="lbl">MES</div></div>
    </div>
    <button id="btnMas">+</button>
    <button id="btnMenos">−</button>
    <label class="wakelock">
      <input type="checkbox" id="chkWake"> Mantener pantalla encendida
    </label>
    <div class="atajos">Atajos: <b>+</b> o <b>↑</b> suma · <b>−</b> o <b>↓</b> deshace</div>
  </section>

  <!-- ========== VISTA HISTORIAL ========== -->
  <section id="vistaHistorial">
    <div class="navMes">
      <button id="mesPrev">‹</button>
      <div class="titulo" id="mesTitulo"></div>
      <button id="mesNext">›</button>
    </div>
    <div id="totalMes"></div>
    <div id="listaDias"></div>
    <div class="exportBtns">
      <button id="btnCSV">Exportar CSV</button>
      <button id="btnBackup">Respaldar JSON</button>
      <label for="fileRestore">Restaurar JSON<input type="file" id="fileRestore" accept=".json" hidden></label>
    </div>
  </section>
</main>

<!-- Navegación inferior -->
<nav>
  <button id="tabContador" class="activo">Contador</button>
  <button id="tabHistorial">Historial</button>
</nav>

<script>
/* =====================================================================
   CONTADOR CHAT — app de un solo archivo
   Datos: { "YYYY-MM-DD": cantidad } guardados en localStorage.
   La clave de fecha se calcula SIEMPRE en zona America/Guatemala,
   así el cambio de día ocurre a medianoche de Guatemala.
   ===================================================================== */

const TZ = 'America/Guatemala';
const LS_KEY = 'contadorChatDatos';

/* ---------- Utilidades de fecha ---------- */

// Devuelve "YYYY-MM-DD" de la fecha dada (o ahora) en Guatemala.
function claveFecha(d = new Date()) {
  // formatToParts evita problemas de orden de partes entre navegadores
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(d);
  const get = t => p.find(x => x.type === t).value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}

// Lunes de la semana (lunes..domingo) que contiene la clave dada.
function lunesDe(clave) {
  const [y,m,d] = clave.split('-').map(Number);
  const f = new Date(Date.UTC(y, m-1, d));
  const dia = (f.getUTCDay() + 6) % 7;      // 0 = lunes
  f.setUTCDate(f.getUTCDate() - dia);
  return f;
}

// Clave "YYYY-MM-DD" de una fecha construida en UTC (sin convertir de zona horaria).
function claveUTC(f) { return f.toISOString().slice(0,10); }

// Suma/resta días a una clave y devuelve nueva clave.
function sumarDias(clave, n) {
  const [y,m,d] = clave.split('-').map(Number);
  return claveUTC(new Date(Date.UTC(y, m-1, d + n)));
}

/* ---------- Persistencia (localStorage con try/catch) ---------- */

let datos = {};   // { "2026-10-01": 5, ... }

function cargar() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) datos = JSON.parse(raw) || {};
  } catch (e) {
    console.warn('No se pudo leer localStorage:', e);
    datos = {};
  }
}

function guardar() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(datos));
  } catch (e) {
    alert('No se pudo guardar. ¿Almacenamiento lleno o modo privado?');
    console.warn(e);
  }
}

/* ---------- Lógica de conteo ---------- */

function totalHoy()  { return datos[claveFecha()] || 0; }

function totalSemana() {
  const lunes = lunesDe(claveFecha());
  let t = 0;
  for (let i = 0; i < 7; i++) t += datos[sumarDias(claveUTC(lunes), i)] || 0;
  return t;
}

function totalMes(prefijo) {  // prefijo = "YYYY-MM"
  let t = 0;
  for (const k in datos) if (k.startsWith(prefijo)) t += datos[k];
  return t;
}

function sumar(n) {
  const hoy = claveFecha();
  const nuevo = (datos[hoy] || 0) + n;
  if (nuevo < 0) return;              // nunca baja de 0
  datos[hoy] = nuevo;
  guardar();
  pintar();
  // Feedback: animación + vibración corta
  const el = document.getElementById('hoyNum');
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  if (navigator.vibrate) navigator.vibrate(30);
}

function pintar() {
  document.getElementById('hoyNum').textContent = totalHoy();
  document.getElementById('semNum').textContent = totalSemana();
  document.getElementById('mesNum').textContent = totalMes(claveFecha().slice(0,7));
}

/* ---------- Historial (mes navegable) ---------- */

let mesVisto = claveFecha().slice(0,7);   // "YYYY-MM" que se está viendo

function pintarHistorial() {
  const [y, m] = mesVisto.split('-').map(Number);
  const nombre = new Date(Date.UTC(y, m-1, 1))
    .toLocaleDateString('es-ES', { month:'long', year:'numeric', timeZone:'UTC' });
  document.getElementById('mesTitulo').textContent = nombre;
  document.getElementById('totalMes').textContent = `Total del mes: ${totalMes(mesVisto)}`;

  // Días del mes, solo los que tienen conteo > 0 o son hoy
  const diasEnMes = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const hoy = claveFecha();
  let html = '';
  for (let d = diasEnMes; d >= 1; d--) {
    const clave = `${mesVisto}-${String(d).padStart(2,'0')}`;
    const cant = datos[clave] || 0;
    if (cant === 0 && clave !== hoy) continue;
    const fecha = new Date(Date.UTC(y, m-1, d))
      .toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short', timeZone:'UTC' });
    html += `<div class="fila"><span>${fecha}${clave===hoy?' (hoy)':''}</span><span class="cant">${cant}</span></div>`;
  }
  document.getElementById('listaDias').innerHTML = html || '<p style="color:#8b93a5;text-align:center;padding:20px">Sin datos este mes.</p>';
}

function cambiarMes(delta) {
  const [y, m] = mesVisto.split('-').map(Number);
  const f = new Date(Date.UTC(y, m-1+delta, 1));
  mesVisto = claveUTC(f).slice(0,7);
  pintarHistorial();
}

/* ---------- Exportar / Respaldar / Restaurar ---------- */

function descargar(nombre, texto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));
  a.download = nombre;
  a.click();
  URL.revokeObjectURL(a.href);
}

function exportarCSV() {
  let csv = 'fecha,cantidad\n';
  for (const k of Object.keys(datos).sort()) csv += `${k},${datos[k]}\n`;
  descargar(`contador-chat_${claveFecha()}.csv`, csv, 'text/csv');
}

function respaldar() {
  descargar(`respaldo-contador_${claveFecha()}.json`, JSON.stringify(datos, null, 2), 'application/json');
}

function restaurar(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (typeof obj !== 'object' || obj === null) throw new Error('formato inválido');
      // Validar claves y valores
      for (const k in obj) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || typeof obj[k] !== 'number' || obj[k] < 0)
          throw new Error('datos inválidos');
      }
      datos = obj;
      guardar(); pintar(); pintarHistorial();
      alert('Datos restaurados correctamente.');
    } catch (e) {
      alert('Archivo no válido: ' + e.message);
    }
  };
  reader.readAsText(file);
  ev.target.value = '';   // permite volver a elegir el mismo archivo
}

/* ---------- Wake Lock (pantalla encendida) ---------- */

let wakeLock = null;
async function pedirWakeLock(activar) {
  try {
    if (activar && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    } else if (wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch (e) { console.warn('Wake Lock no disponible:', e); }
}
// Reactivar al volver a la app (la pantalla suelta el lock al ocultarse)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && document.getElementById('chkWake').checked) pedirWakeLock(true);
});

/* ---------- Cambio de día automático ---------- */

// Cada 30s revisa si cambió el día en Guatemala; si cambió, repinta (hoy vuelve a 0).
let ultimoDia = claveFecha();
setInterval(() => {
  const ahora = claveFecha();
  if (ahora !== ultimoDia) {
    ultimoDia = ahora;
    mesVisto = ahora.slice(0,7);
    pintar(); pintarHistorial();
  }
}, 30000);

/* ---------- Navegación entre pestañas ---------- */

function mostrarVista(cual) {
  const esContador = cual === 'contador';
  document.getElementById('vistaContador').style.display  = esContador ? 'flex' : 'none';
  document.getElementById('vistaHistorial').style.display = esContador ? 'none' : 'flex';
  document.getElementById('tabContador').classList.toggle('activo', esContador);
  document.getElementById('tabHistorial').classList.toggle('activo', !esContador);
  if (!esContador) pintarHistorial();
}

/* ---------- Arranque ---------- */

cargar();
pintar();

document.getElementById('btnMas').addEventListener('click', () => sumar(1));
document.getElementById('btnMenos').addEventListener('click', () => sumar(-1));
document.getElementById('tabContador').addEventListener('click', () => mostrarVista('contador'));
document.getElementById('tabHistorial').addEventListener('click', () => mostrarVista('historial'));
document.getElementById('mesPrev').addEventListener('click', () => cambiarMes(-1));
document.getElementById('mesNext').addEventListener('click', () => cambiarMes(1));
document.getElementById('btnCSV').addEventListener('click', exportarCSV);
document.getElementById('btnBackup').addEventListener('click', respaldar);
document.getElementById('fileRestore').addEventListener('change', restaurar);
document.getElementById('chkWake').addEventListener('change', e => pedirWakeLock(e.target.checked));

// Wake Lock: activado por defecto solo en pantallas táctiles (teléfono/tablet)
const esTactil = window.matchMedia('(pointer: coarse)').matches;
document.getElementById('chkWake').checked = esTactil;
if (esTactil) pedirWakeLock(true);

// Atajos de teclado (escritorio): solo en la vista Contador
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.getElementById('vistaContador').style.display === 'none') return;
  if (['+','=','ArrowUp'].includes(e.key)) { e.preventDefault(); sumar(1); }
  else if (['-','_','ArrowDown'].includes(e.key)) { e.preventDefault(); sumar(-1); }
});
</script>
</body>
</html>
